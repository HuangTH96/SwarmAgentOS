version: '3.8'

services:
  fastapi-msdk-udp:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-msdk-udp
    ports:
      - "8000:8000/tcp"   # FastAPI 接口
      - "8081:8081/udp"   # UDP 监听
      - "8081:8081/tcp"   # HTTP 接口 ✔   
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET=your-secret-key-change-this-in-production-min-32-chars
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - drone-network

networks:
  drone-network:
    driver: bridge

